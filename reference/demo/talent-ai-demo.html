<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talent AI v2 — نموذج تجريبي لدورة التوظيف</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --blue:#1e4db5; --blue-dark:#173d93; --blue-soft:#e4ecfb; --blue-text:#1b3f94;
  --bg:#eef2fb; --card:#ffffff; --text:#1f2b47; --muted:#6f7d9c; --border:#e1e8f4; --border-2:#cbd6ea;
  --green:#1e8a4f; --green-bg:#dff4e6; --amber:#b36b00; --amber-bg:#fff1d6; --red:#c53030; --red-bg:#fde4e4;
  --purple:#6b3fd4; --purple-bg:#ece6fb; --grey-bg:#eef1f7; --code-bg:#0f1a33; --code-text:#d7e3ff;
  --radius:14px; --radius-s:9px; --shadow:0 1px 2px rgba(23,43,99,.06),0 4px 14px rgba(23,43,99,.05);
  --font:'IBM Plex Sans Arabic',"Segoe UI",Tahoma,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--blue);text-decoration:none}
.num,code,.mono{font-family:"IBM Plex Mono",Consolas,"Courier New",monospace;direction:ltr;unicode-bidi:isolate}
bdi{unicode-bidi:isolate}
.app{display:flex;min-height:100vh}
/* rail */
.rail{width:68px;background:var(--blue);display:flex;flex-direction:column;align-items:center;padding:14px 0;gap:10px;flex:none;align-self:stretch;min-height:100vh}
.rail .spacer{flex:1;max-height:70vh}
.rail .mark{width:38px;height:38px;border-radius:12px;background:#fff;color:var(--blue);display:grid;place-items:center;font-weight:700;font-size:18px;margin-bottom:10px}
.rail button{width:44px;height:44px;border:0;border-radius:12px;background:transparent;color:#cfdcff;cursor:pointer;display:grid;place-items:center}
.rail button.active{background:#fff;color:var(--blue)}
.rail .spacer{flex:1}
/* sidebar */
.sidebar{width:232px;background:#fff;border-inline-end:1px solid var(--border);flex:none;display:flex;flex-direction:column;align-self:stretch;min-height:100vh}
.sidebar .me{position:sticky;bottom:0;background:#fff}
.brand{padding:16px 18px 8px;font-weight:700;color:var(--blue);font-size:17px;display:flex;align-items:center;gap:8px}
.brand small{display:block;font-weight:500;font-size:10px;color:var(--muted);letter-spacing:.08em}
.ws{margin:8px 14px;padding:10px 12px;border:1px solid var(--border);border-radius:12px;display:flex;align-items:center;gap:10px}
.ws .ico{width:30px;height:30px;border-radius:9px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
.ws b{display:block;font-size:13px}.ws small{color:var(--muted);font-size:11px}
.nav{padding:6px 10px;display:flex;flex-direction:column;gap:2px}
.nav .sec{font-size:11px;color:var(--muted);padding:12px 12px 4px;letter-spacing:.04em}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--text);cursor:pointer;border:0;background:none;text-align:start;width:100%}
.nav a:hover{background:var(--grey-bg)}
.nav a.active{background:var(--blue-soft);color:var(--blue-text);font-weight:600;box-shadow:inset 3px 0 0 var(--blue)}
[dir=ltr] .nav a.active{box-shadow:inset 3px 0 0 var(--blue)}
.nav a .cnt{margin-inline-start:auto;background:var(--grey-bg);border-radius:20px;padding:0 8px;font-size:11px;color:var(--muted)}
.nav a.new::after{content:'جديد';font-size:10px;background:var(--purple-bg);color:var(--purple);border-radius:8px;padding:0 6px}
[dir=ltr] .nav a.new::after{content:'new'}
.me{margin-top:auto;padding:14px 18px;border-top:1px solid var(--border);display:flex;gap:10px;align-items:center;font-size:12px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:700}
/* main */
.main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:12px;padding:12px 24px;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:20}
.crumbs{color:var(--muted);font-size:13px;display:flex;gap:6px;align-items:center;flex:1;min-width:0}
.crumbs b{color:var(--text)}
.badge-demo{background:var(--amber-bg);color:var(--amber);border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.tgl{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);cursor:pointer;user-select:none;white-space:nowrap}
.sw{width:34px;height:20px;border-radius:20px;background:#cbd6ea;position:relative;transition:.2s}
.sw::after{content:'';position:absolute;top:3px;inset-inline-start:3px;width:14px;height:14px;border-radius:50%;background:#fff;transition:.2s}
.sw.on{background:var(--blue)}.sw.on::after{inset-inline-start:17px}
.seg{display:inline-flex;border:1px solid var(--border-2);border-radius:10px;overflow:hidden}
.seg button{border:0;background:#fff;padding:6px 12px;cursor:pointer;font-size:12px}
.seg button.on{background:var(--blue);color:#fff}
.content{padding:20px 24px 60px;display:flex;gap:20px;align-items:flex-start}
.screen{flex:1;min-width:0}
/* tour */
.tour{background:#fff;border-bottom:1px solid var(--border);padding:12px 24px}
.steps{display:flex;gap:4px;padding-bottom:6px}
.step{flex:1;min-width:0;border:1px solid var(--border);border-radius:10px;padding:5px 4px;font-size:10.5px;color:var(--muted);cursor:pointer;background:#fff;text-align:center;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.step b{display:block;font-size:12px;color:var(--text);font-weight:600}
.step.done{border-color:#bcd0f5;background:#f5f8ff}
.step.cur{border-color:var(--blue);background:var(--blue);color:#dfe8ff}
.step.cur b{color:#fff}
.caption{display:flex;align-items:center;gap:14px;margin-top:10px}
.caption .who{flex:none;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600}
.who.hr{background:var(--blue-soft);color:var(--blue-text)}.who.applicant{background:var(--green-bg);color:var(--green)}.who.system{background:var(--purple-bg);color:var(--purple)}
.caption p{margin:0;flex:1;font-size:13px}
.btn{border:1px solid var(--border-2);background:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--grey-bg)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:var(--blue-dark)}
.btn.danger{background:var(--red-bg);border-color:#f3c0c0;color:var(--red)}
.btn.ok{background:var(--green-bg);border-color:#bfe6cd;color:var(--green)}
.btn.warn{background:var(--amber-bg);border-color:#f0d9a8;color:var(--amber)}
.btn.sm{padding:5px 10px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* cards */
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px 20px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px;display:flex;align-items:center;gap:10px}
.card h2 small{font-weight:400;color:var(--muted);font-size:12px}
.card h2::before{content:'';width:3px;height:16px;background:var(--blue);border-radius:2px}
.page-title{display:flex;align-items:flex-start;gap:14px;margin:4px 0 16px}
.page-title h1{margin:0;font-size:24px;font-weight:600}
.page-title .sub{color:var(--muted);font-size:13px;margin-top:2px}
.page-title .actions{margin-inline-start:auto;display:flex;gap:8px;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 24px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;font-weight:600}
.field label .req{color:var(--red)}
.field .val,.field input,.field select,.field textarea{width:100%;border:1px solid var(--border-2);border-radius:10px;padding:8px 12px;background:#fff;min-height:38px}
.field .val.ro{background:#f6f8fc;color:#4b5876}
.field textarea{min-height:90px;resize:vertical}
.field .help{font-size:11px;color:var(--muted);margin-top:4px}
.field.new label::after{content:'جديد';margin-inline-start:6px;font-size:10px;background:var(--purple-bg);color:var(--purple);border-radius:8px;padding:0 6px;font-weight:600}
[dir=ltr] .field.new label::after{content:'new'}
.chk{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:#fff}
.chk input{margin-top:3px}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip.green{background:var(--green-bg);color:var(--green)}.chip.red{background:var(--red-bg);color:var(--red)}.chip.amber{background:var(--amber-bg);color:var(--amber)}
.chip.blue{background:var(--blue-soft);color:var(--blue-text)}.chip.grey{background:var(--grey-bg);color:var(--muted)}.chip.purple{background:var(--purple-bg);color:var(--purple)}
.chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.score{font-weight:700;font-size:16px}
.score.high{color:var(--green)}.score.medium{color:var(--amber)}.score.low{color:var(--red)}
.score.off{color:#9aa6c0;font-weight:600}
.tag-off{display:inline-block;background:var(--grey-bg);color:var(--muted);border:1px dashed var(--border-2);border-radius:8px;padding:0 7px;font-size:11px;font-weight:600;white-space:nowrap}
.dev .ar{font-family:var(--font);letter-spacing:0;direction:rtl;unicode-bidi:isolate;font-size:12px}
.poolwhy{font-size:12px;line-height:1.6}.poolwhy b{display:block;font-size:11px;color:var(--muted)}
.poolwhy .was{color:var(--red)}.poolwhy .now{color:var(--green)}
.note{font-size:12px;color:var(--muted);border-inline-start:3px solid var(--border-2);padding:6px 10px;margin:8px 0;background:#f8faff;border-radius:0 8px 8px 0}
[dir=ltr] .note{border-radius:0 8px 8px 0}
.note.strong{border-color:var(--amber);background:var(--amber-bg);color:var(--amber)}
.note.danger{border-color:var(--red);background:var(--red-bg);color:var(--red)}
.disclaimer{font-size:12px;color:var(--muted);margin:8px 0 0;display:flex;gap:6px;align-items:center}
/* tables */
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:start;font-weight:600;color:var(--muted);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--border);vertical-align:middle}
td.num,td>bdi.num{white-space:nowrap}
tr.row:hover td{background:#f6f9ff;cursor:pointer}
tr.sel td{background:var(--blue-soft)}
.w-in{width:64px;border:1px solid var(--border-2);border-radius:8px;padding:4px 8px;text-align:center}
.filters{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.filters select,.filters input{border:1px solid var(--border-2);border-radius:10px;padding:7px 10px;background:#fff;min-height:36px}
.search{flex:1;min-width:200px}
.quote{display:inline-block;background:#fff8e1;border-inline-start:3px solid #f0c454;padding:3px 8px;border-radius:6px;font-size:12px;color:#5b4a12;cursor:pointer;max-width:420px}
.quote:hover{background:#ffefb8}
.quote.none{background:var(--grey-bg);border-color:var(--border-2);color:var(--muted);cursor:default}
/* dev panel */
.dev{width:400px;flex:none;position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto;background:var(--code-bg);color:var(--code-text);border-radius:var(--radius);padding:14px 16px;font-size:12px;direction:ltr;text-align:left}
.dev h3{margin:0 0 8px;font-size:12px;color:#8fb0ff;letter-spacing:.08em;text-transform:uppercase}
.dev h4{margin:14px 0 6px;font-size:12px;color:#ffd27a}
.dev .ep{background:#1b2a4d;border-radius:8px;padding:6px 10px;font-family:Consolas,monospace;color:#c7f0d2;margin:6px 0}
.dev pre{margin:0;white-space:pre-wrap;word-break:break-word;font-family:Consolas,"IBM Plex Sans Arabic","Courier New",monospace;font-size:11.5px;line-height:1.5;background:#14213f;padding:10px;border-radius:8px;border:1px solid #27365e}
.dev .k{color:#9fc4ff}.dev .s{color:#ffd9a3}.dev .n{color:#b5f5c2}
.dev .wr{color:#ffb5b5;font-size:11px;margin-top:4px}
.dev p{margin:4px 0;color:#aab8d9}
/* map */
.map{display:flex;align-items:stretch;gap:0;flex-wrap:wrap;row-gap:18px}
.mnode{flex:1;min-width:150px;position:relative;padding-inline-end:26px}
.mnode .box{background:#fff;border:1px solid var(--border);border-radius:12px;padding:12px;height:100%;cursor:pointer;transition:.15s;box-shadow:var(--shadow)}
.mnode .box:hover{border-color:var(--blue);transform:translateY(-2px)}
.mnode .box b{display:block;font-size:13px;margin-bottom:4px}
.mnode .box small{color:var(--muted);font-size:11px;display:block;line-height:1.4}
.mnode .box .who{font-size:10px;margin-top:8px;display:inline-block;padding:1px 8px;border-radius:12px}
.mnode .arrow{position:absolute;inset-inline-end:4px;top:40%;color:var(--border-2);font-size:18px}
.mnode:last-child .arrow{display:none}
.branch{margin-top:10px;display:flex;align-items:center;gap:10px}
.branch .box{border-style:dashed}
/* processing */
.pipe{display:flex;flex-direction:column;gap:8px}
.pstep{display:flex;gap:14px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;opacity:.5;transition:.3s}
.pstep.on{opacity:1;border-color:var(--blue)}
.pstep.done{opacity:1;border-color:#bfe6cd;background:#f6fcf8}
.pstep .n{width:28px;height:28px;border-radius:50%;background:var(--grey-bg);display:grid;place-items:center;font-weight:700;flex:none;color:var(--muted)}
.pstep.on .n{background:var(--blue);color:#fff;animation:pulse 1s infinite}
.pstep.done .n{background:var(--green);color:#fff}
.pstep .t b{display:block}.pstep .t small{color:var(--muted)}
.pstep .res{margin-inline-start:auto;font-size:12px;color:var(--green);max-width:50%;text-align:end}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(30,77,181,.4)}100%{box-shadow:0 0 0 10px rgba(30,77,181,0)}}
/* ranking */
.rankrow>div{min-width:0}.rankrow .bar{width:130px}
.rankrow{display:grid;grid-template-columns:44px minmax(0,2.2fr) 80px 110px 130px 80px 70px;gap:10px;align-items:center;padding:10px 12px;border:1px solid var(--border);border-radius:12px;background:#fff;margin-bottom:8px;transition:transform .5s,background .5s}
.rankrow.up{background:#eefaf2}.rankrow.down{background:#fff3f3}
.rankrow .pos{width:34px;height:34px;border-radius:10px;background:var(--blue-soft);color:var(--blue-text);display:grid;place-items:center;font-weight:700}
.bar{height:8px;background:var(--grey-bg);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--blue);border-radius:6px}
.bar.high i{background:var(--green)}.bar.medium i{background:#e0a200}.bar.low i{background:var(--red)}
.mv{font-size:12px;font-weight:700}.mv.up{color:var(--green)}.mv.down{color:var(--red)}
details.collapse{border:1px dashed var(--border-2);border-radius:12px;padding:8px 12px;margin-top:10px}
details.collapse summary{cursor:pointer;font-weight:600;color:var(--muted)}
/* public site */
.site{background:#f4f6fa;min-height:calc(100vh - 60px);margin:-20px -24px -60px;padding:0 0 60px}
.site .top{background:#fff;border-bottom:1px solid var(--border);padding:12px 40px;display:flex;align-items:center;gap:14px}
.site .top .logo{font-weight:700;color:var(--blue);font-size:18px}
.site .wrap{max-width:860px;margin:30px auto;padding:0 20px}
.site .jobcard{background:#fff;border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:12px;cursor:pointer}
.site .jobcard:hover{border-color:var(--blue)}
.site .jobcard b{font-size:16px}
.site .meta{color:var(--muted);font-size:12px;display:flex;gap:14px;flex-wrap:wrap;margin-top:6px}
.site .facts{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.site .facts div{background:#fff;border:1px solid var(--border);border-radius:10px;padding:10px}
.site .facts small{display:block;color:var(--muted);font-size:11px;letter-spacing:.04em}
.site .formcard{background:#fff;border:1px solid var(--border);border-radius:14px;padding:26px 30px}
.site .formcard h1{margin:0 0 18px;font-size:26px;font-weight:600}
.site .sechead{font-weight:600;margin:18px 0 10px;padding-top:10px;border-top:1px solid var(--border)}
.upl{display:flex;align-items:center;gap:10px}
.upl .fn{font-size:12px;color:var(--muted)}
.success{text-align:center;padding:40px 20px}
.success .ok{width:70px;height:70px;border-radius:50%;background:var(--green-bg);color:var(--green);display:grid;place-items:center;font-size:34px;margin:0 auto 14px}
/* applicant form */
.aihead{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:14px}
.aihead .kpi{border:1px solid var(--border);border-radius:12px;padding:10px 12px}
.aihead .kpi small{display:block;color:var(--muted);font-size:11px;margin-bottom:4px}
.aihead .kpi b{font-size:20px}
.cvpanel{position:sticky;top:76px;max-height:calc(100vh - 96px);overflow:auto}
.cvtext{white-space:pre-wrap;line-height:1.9;font-size:13px;background:#fbfcff;border:1px solid var(--border);border-radius:10px;padding:14px}
.cvtext mark{background:#ffe58a;border-radius:3px;padding:0 2px}
.cvtext mark.hot{background:#ffbf47;box-shadow:0 0 0 3px #ffe9b3}
.ocr{display:inline-flex;gap:5px;align-items:center}
.split{display:grid;grid-template-columns:1.5fr 1fr;gap:16px;align-items:start}
.tag-hr{background:var(--purple-bg);color:var(--purple);border-radius:8px;padding:0 6px;font-size:11px;font-weight:600}
.audit{font-size:11px;color:var(--muted);display:flex;gap:14px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:10px;margin-top:12px}
.summary{background:#f8faff;border-radius:10px;padding:10px 14px;font-size:13px}
/* compare */
.cmp{display:grid;gap:10px}
.cmp table td:first-child{font-weight:600}
/* modal */
.overlay{position:fixed;inset:0;background:rgba(15,26,51,.45);display:none;align-items:center;justify-content:center;z-index:50}
.overlay.on{display:flex}
.modal{background:#fff;border-radius:16px;width:520px;max-width:94vw;padding:22px 24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
.modal h3{margin:0 0 12px;font-size:17px}
.modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
.toast{position:fixed;bottom:22px;inset-inline-start:50%;transform:translateX(-50%);background:#1f2b47;color:#fff;padding:10px 18px;border-radius:12px;font-size:13px;z-index:60;opacity:0;transition:.3s;pointer-events:none}
[dir=rtl] .toast{transform:translateX(50%)}
.toast.on{opacity:1}
.typing::after{content:'▍';animation:blink .8s infinite}
@keyframes blink{50%{opacity:0}}
.draft{border:1px dashed var(--purple);background:#faf8ff;border-radius:12px;padding:14px;font-size:13px;white-space:pre-wrap;line-height:1.8}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv small{color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.poolcard{display:grid;grid-template-columns:1.4fr 100px 1.6fr 1fr auto;gap:12px;align-items:center;border:1px solid var(--border);border-radius:12px;padding:12px;margin-bottom:8px;background:#fff}
.sim{font-weight:700;font-size:18px;color:var(--blue-text)}
.warnbox{background:var(--amber-bg);border:1px solid #f0d9a8;color:var(--amber);border-radius:10px;padding:10px 12px;font-size:12px;margin-top:8px}
.list-id{font-size:11px;color:var(--muted)}
/* processing visuals */
.pipe-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.pipe-grid .pstep{padding:8px 10px}.pipe-grid .pstep .t small{display:block;font-size:11px;line-height:1.4}
.stagebox{margin-top:14px;border:1px solid var(--border);border-radius:12px;padding:14px;background:#fbfcff}
.stage-h{margin:0 0 8px;font-size:13px}
.sbs{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}

  const actions = `<button class="btn ok" data-action="hrStatus" data-id="${app.id}" data-status="Shortlisted">${t('ترشيح للمقابلة', 'Shortlist')}</button><button class="btn danger" data-action="hrStatus" data-id="${app.id}" data-status="Rejected">${t('رفض', 'Reject')}</button><button class="btn warn" data-action="hrStatus" data-id="${app.id}" data-status="Hold">${t('تعليق', 'Hold')}</button>`;
  const head = pageTitle(appName(app), `Job Applicant · ${N(app.id)} · ${chipStatus(app.status)} · ${L(o.title)} · ai_status ${chipAi(app)}`, actions);
  const dups = dupPeers(app);
  const dupBox = dups.length ? `<div class="note danger">⧉ <b>${t('طلب مكرر', 'Duplicate application')}</b> — ${t('رقم الهوية والبريد والجوال متطابقة مع', 'Same national ID, e-mail and phone as')} ${dups.map(d => `<a data-action="openApp" data-id="${d.id}" style="cursor:pointer"><b>${N(d.id)}</b> (${D(d.applied)})</a>`).join('، ')}. ${t('لا يُحذف أي طلب تلقائيًا؛ يدمجها الموظف. يُرتَّب الطلب الأصلي فقط.', 'Nothing is deleted automatically; HR merges them. Only the original application is ranked.')}</div>` : '';
  const flagBox = (app.ai.stale || app.ai.dataChanged) ? `<div class="note strong">⚠ ${app.ai.stale ? t('هذه النتيجة محسوبة بنسخة معايير سابقة', 'This result was computed with a previous criteria version') + ` (${N(app.ai.version)} ≠ ${N(prof.version)})` : t('النتيجة لا تعكس آخر تعديل على بيانات المتقدم', 'The result does not reflect the latest edit to the applicant data')}. ${t('لا تُعرض كنتيجة حالية ولا تدخل الترتيب حتى تُعاد.', 'It is not shown as current and is not ranked until re-scored.')} <button class="btn sm primary" data-action="rescoreOne" data-id="${app.id}">↻ ${t('إعادة التقييم', 'Re-score')}</button></div>` : '';
  if (!ev){
    const failed = app.ai.status === 'Failed';
    return head + dupBox + `<div class="card"><h2>${t('تقييم الذكاء الاصطناعي', 'AI assessment')} ${chipAi(app)}</h2>${failed ? `<div class="note danger">✗ ${L(app.ai.error)} — ${t('بعد', 'after')} ${N(S.settings.maxRetries)} ${t('محاولات. الطلب محفوظ وظاهر بشكل طبيعي، وإجاباته كاملة.', 'attempts. The application is saved and visible normally; the answers are complete.')}</div><div style="display:flex;gap:8px;margin-top:10px"><button class="btn primary" data-action="retryJob" data-id="${app.id}">↻ ${t('إعادة المحاولة', 'Retry')}</button></div>` : `<div class="note"><span class="spin"></span> ${t('الطلب في طابور المعالجة (AI Recruitment Job). النتيجة ستظهر هنا عند الاكتمال؛ القرار البشري متاح في أي وقت.', 'The application is in the processing queue (AI Recruitment Job). The result appears here on completion; the human decision is available at any time.')}</div>`}</div>` + answersCard(app) + `<div class="cvpanel"></div>`;
  }
  const reasons = ev.elig.reasons.map(r => `<li>${r.ok === true ? '✓' : r.ok === false ? '✗' : '?'} ${L(r)}</li>`).join('');
  const evCell = r => { if (r.missing) return `<span class="src missing">${t('دليل ناقص', 'missing evidence')}</span> <span class="hint">${t('لم يُجب ولا تذكره السيرة', 'not answered and not in the CV')}</span>`; let h = r.src === 'cv' ? `${srcBadge(r)} <span class="quote" data-action="hilite" data-key="${r.key}">“${esc(r.ev.ar)}”</span>` : `${srcBadge(r)} <span class="quote none" style="cursor:default">${esc(L(r.ev))}</span>`; if (r.contradiction) h = `<div class="contra"><div><span class="src form">${t('إجابة النموذج', 'form answer')}</span> <span class="quote none">${esc(L(r.form.ev))}</span> → ${chipLvl(r.form.lvl)}</div><div><span class="src cv">${t('من السيرة', 'from CV')}</span> <span class="quote" data-action="hilite" data-key="${r.key}">“${esc(r.cv.q)}”</span> → ${chipLvl(r.cv.lvl)}</div><span class="chip red">⇄ ${t('تعارض — يُستخدم الأدنى', 'contradiction — lower value used')}</span></div>`; else if (r.form && r.cv && r.src === 'form') h += ` <div class="hint">${t('تؤكده السيرة:', 'confirmed by the CV:')} <span class="quote" data-action="hilite" data-key="${r.key}" style="max-width:300px">“${esc(r.cv.q)}”</span></div>`; return h; };
  const crit = ev.rows.map(r => `<tr class="${S.hiliteKey === r.key ? 'sel' : ''}"><td>${critName(r.key)}</td><td>${mandLabel(r.mandatory)}</td><td class="num">${r.w}%</td><td>${chipLvl(r.lvl)} <span class="hint">${rubricText(r.key, r.lvl)}</span>${r.override ? ` <span class="tag-hr" title="${esc(r.override.reason)}">${t('تعديل HR', 'HR edit')}</span><div class="hint">${t('مستوى الذكاء:', 'AI level:')} ${r.base}</div>` : ''}</td><td>${evCell(r)}</td><td><button class="btn sm" data-action="override" data-id="${app.id}" data-key="${r.key}">${t('إلغاء الحكم', 'Override')}</button></td></tr>`).join('');
  const ins = insights(ev);
  const insightsCard = `<div class="card"><h2>${t('نقاط القوة والنواقص', 'Strengths and gaps')}</h2><div class="grid3">
    <div><b class="lbl">${t('نقاط القوة', 'Strengths')} <span class="hint">(75–100)</span></b>${ins.strengths.length ? ins.strengths.map(r => `<div class="chip green" style="margin:3px 2px">${critName(r.key)} · ${r.lvl}</div>`).join('') : `<p class="hint">${t('لا شيء', 'none')}</p>`}</div>
    <div><b class="lbl">${t('النواقص', 'Gaps')} <span class="hint">(0–25 ${t('أو دليل ناقص', 'or missing')})</span></b>${ins.gaps.length ? ins.gaps.map(r => `<div class="chip ${r.missing ? 'amber' : 'red'}" style="margin:3px 2px">${critName(r.key)} · ${r.missing ? t('دليل ناقص', 'missing') : r.lvl}</div>`).join('') : `<p class="hint">${t('لا شيء', 'none')}</p>`}</div>
    <div><b class="lbl">${t('ما الذي يرفع درجته', 'What would raise the score')}</b>${ins.raise.length ? `<ul class="ul">${ins.raise.map(x => `<li>${x.missing ? t('تقديم دليل على', 'Provide evidence for') : t('إثبات المستوى 100 في', 'Prove level 100 in')} «${critName(x.key)}»: <b class="num">+${fmt1(x.points)}</b> ${t('نقطة', 'points')}</li>`).join('')}</ul>` : `<p class="hint">${t('الدرجة كاملة', 'Full score')}</p>`}</div></div></div>`;
  const isSecOpening = prof.id === 'sec_sup';
  return head + dupBox + flagBox +
  `<div class="split"><div>
    <div class="card"><h2>${t('تقييم الذكاء الاصطناعي', 'AI assessment')} <span class="chip purple">${t('قراءة فقط — لا يغيّر الحالة', 'read-only — never changes status')}</span> ${flagsHtml(app)}</h2>
      <div class="aihead">
        <div class="kpi"><small>${t('الأهلية', 'Eligibility')}</small>${chipElig(ev.elig.status)}</div>
        <div class="kpi"><small>${t('الدرجة', 'Score')} <code>ai_score</code></small><b class="score ${ev.elig.status === 'not_eligible' ? 'off' : ev.band}">${N(fmt1(ev.score))}</b> <span class="hint">/ 100</span><div>${chipBand(ev.band, ev)}</div></div>
        <div class="kpi"><small>${t('التغطية', 'Coverage')}</small><b>${N(pct(ev.coverage) + '%')}</b>${ev.needsReview ? `<div><span class="chip amber">${t('يحتاج مراجعة', 'Needs review')}</span></div>` : ''}</div>
        <div class="kpi"><small>${t('الترتيب في الشاغر', 'Rank in opening')}</small><b>${rk ? `${N(rk.rank)} ${t('من', 'of')} ${N(rk.N)}` : '—'}</b>${!rk ? `<div class="hint">${ev.elig.status === 'not_eligible' ? t('غير مرتَّب — غير مستوفٍ', 'Not ranked — not eligible') : app.dupOf ? t('غير مرتَّب — طلب مكرر', 'Not ranked — duplicate') : (app.ai.stale || app.ai.dataChanged) ? t('غير مرتَّب — نتيجة قديمة', 'Not ranked — stale result') : t('غير مرتَّب — يحتاج مراجعة', 'Not ranked — needs review')}</div>` : ''}</div>
      </div>
      <div class="grid2"><div><b class="lbl">${t('أسباب الأهلية', 'Eligibility reasons')}</b><ul style="margin:4px 0;padding-inline-start:18px;font-size:12px;line-height:1.8">${reasons || `<li>${t('لا شروط إلزامية لهذا الشاغر', 'No hard rules for this opening')}</li>`}</ul></div>
      <div><b class="lbl">${t('الملخص', 'Summary')}</b><div class="summary">${L(app.summary)}</div></div></div>
      ${ev.mandatoryZero ? `<div class="note danger">${t('معيار إلزامي في المستوى 0 ← الفئة «منخفضة» بغض النظر عن الدرجة.', 'A mandatory criterion at level 0 → band "Low" regardless of the score.')}</div>` : ''}
      ${ev.contradictions ? `<div class="note danger">⇄ ${t('تعارض بين الإجابة والسيرة: يُستخدم المستوى الأدنى المدعوم بالدليل، والطلب يحتاج مراجعة بشرية.', 'Answer vs CV contradiction: the lower evidenced level is used and the application needs human review.')}</div>` : ''}
      ${disclaimer()}
    </div>
    ${insightsCard}
    <div class="card"><h2>${t('المعايير والأدلة', 'Criteria and evidence')} <small>AI Assessment Evidence · ${t('انقر اقتباس السيرة لإبرازه', 'click a CV quote to highlight it')}</small></h2>
      <table><thead><tr><th>${t('المعيار', 'Criterion')}</th><th>${t('النوع', 'Type')}</th><th>${t('الوزن', 'W')}</th><th>${t('المستوى', 'Level')}</th><th>${t('الدليل', 'Evidence')}</th><th></th></tr></thead><tbody>${crit}</tbody></table>
      <div class="audit"><span>${t('النموذج', 'model')}: <code>${S.settings.model}</code></span><span>${t('الموجّه', 'prompt')}: <code>score-v3</code></span><span>${t('نسخة المعايير', 'profile version')}: <code>${prof.name}/${app.ai.version}</code></span><span>${t('بصمة المدخلات', 'input hash')}: <code>${hashOf(app)}</code></span><span>${t('تاريخ التقييم', 'evaluated on')}: <code>${fd(app.evaluatedOn)}</code></span></div>
    </div>
    ${answersCard(app)}
    <div class="card"><h2>${t('بيانات المتقدم', 'Applicant details')}</h2><div class="grid2">
      ${f(t('الاسم الكامل', 'Full name'), appName(app))}${f(t('البريد', 'Email'), '<span class="num">•••••@example.com</span>')}
      ${f(t('الجنسية', 'Nationality'), factRow('nationality'))}${f(t('نوع الهوية ورقمها', 'ID type and number'), `${esc(app.idType)} · <span class="num">${esc(app.idNo)}</span> <span class="hint">(${t('مقنّع', 'masked')})</span>`)}
      ${f(t('العمر (من تاريخ الميلاد)', 'Age (from date of birth)'), factRow('age'))}${isSecOpening ? f(t('الطول (سم)', 'Height (cm)'), factRow('height_cm')) : ''}
      ${isSecOpening ? f(t('الوزن (كجم)', 'Weight (kg)'), factRow('weight_kg')) : ''}${f(t('السيرة', 'CV'), chipCv(app.cvType))}
      ${f(t('تاريخ التقديم', 'Applied on'), D(app.applied))}${f(t('المصدر', 'Source'), t('بوابة التوظيف', 'Careers portal'))}
    </div></div>
  </div>
  <div class="cvpanel"><div class="card"><h2>${t('عرض السيرة الذاتية', 'CV viewer')} ${chipCv(app.cvType)}</h2>${cvHtml(app, ev)}${app.cv ? `<p class="hint">${t('النص كما استُخرج من الملف. الاقتباسات المظلّلة هي أدلة السيرة.', 'Text as extracted from the file. Highlighted quotes are the CV evidence.')}</p>` : ''}</div></div>
  </div>`;
}
function answersCard(app){
  const qs = QUESTIONS[profileOf(app).id] || []; if (!qs.length) return '';
  return `<div class="card"><h2>${t('إجابات نموذج التقديم', 'Application form answers')} <small>${t('المصدر الأساسي للتقييم', 'primary source of the assessment')}</small></h2><table><thead><tr><th>${t('السؤال', 'Question')}</th><th>${t('الإجابة', 'Answer')}</th><th>${t('يغذّي', 'Feeds')}</th><th></th></tr></thead><tbody>${qs.map(q => { const v = app.answers[q.k]; const b = blank(v); return `<tr><td>${L(q)}</td><td>${b ? `<span class="chip amber">${t('لم يُجب', 'not answered')}</span>` : `<b>${esc(Array.isArray(v) ? v.join('، ') : v)}</b>${(v === 0 || v === '0') ? ` <span class="hint">(${t('صفر حقيقي — ليس فراغًا', 'a real zero — not blank')})</span>` : ''}${q.extra && !blank(app.answers[q.extra.k]) ? ` <span class="hint">· ${L(q.extra)}: ${fd(app.answers[q.extra.k])}</span>` : ''}`}</td><td>${q.feeds ? critName(q.feeds) : `<span class="hint">${t('معلومة', 'info')}</span>`}</td><td>${q.feeds && q.type !== 'multi' ? `<button class="btn sm" data-action="editAnswer" data-id="${app.id}" data-k="${q.k}">✎ ${t('تعديل', 'Edit')}</button>` : ''}</td></tr>`; }).join('')}</tbody></table><p class="hint">${t('أي تعديل على الإجابات يعلّم النتيجة الحالية «لا تعكس آخر تعديل» حتى تُعاد.', 'Any edit to the answers flags the current result as "does not reflect the latest edit" until it is re-scored.')}</p></div>`;
}
/* ---------- ranking ---------- */
function rRanking(){
  const oid = 'HR-OPN-2026-0011'; const r = ranking(oid); const prof = r.prof;
  const row = (x) => `<div class="rankrow"><div class="pos num">${x.rank}</div><div><b>${appName(x.app)}</b><div class="list-id">${chipCv(x.app.cvType)} · ${chipStatus(x.app.status)} · ${N(x.app.ai.version)}</div></div><div>${scoreHtml(x.ev)}</div><div>${chipBand(x.ev.band)}</div><div class="bar ${x.ev.band}"><i style="width:${x.ev.score}%"></i></div><div class="hint">${t('تغطية', 'cov.')} ${N(pct(x.ev.coverage) + '%')}</div><div style="display:flex;gap:6px;align-items:center"><label class="tgl"><input type="checkbox" data-action="cmpToggle" data-id="${x.app.id}" ${S.cmp.includes(x.app.id) ? 'checked' : ''}></label><button class="btn sm" data-action="openApp" data-id="${x.app.id}">↗</button></div></div>`;
  const other = (x, why) => `<div class="rankrow" style="grid-template-columns:44px 1.6fr 100px 1.4fr 60px"><div class="pos" style="background:var(--grey-bg);color:var(--muted)">—</div><div><b>${appName(x.app)}</b><div class="list-id">${why}</div></div><div>${x.ev && x.app.ai.status !== 'Failed' ? scoreHtml(x.ev) : `<span class="hint">—</span>`}</div><div>${chipAi(x.app)} ${x.ev ? chipElig(x.ev.elig.status) : ''}</div><div><button class="btn sm" data-action="openApp" data-id="${x.app.id}">↗</button></div></div>`;
  const cmpSel = S.cmp.map(id => r.all.find(x => x.app.id === id)).filter(x => x && x.ev);
  const cmpHtml = cmpSel.length >= 2 ? `<div class="card"><h2>${t('مقارنة جنبًا إلى جنب', 'Side-by-side comparison')} <small>${cmpSel.length} ${t('متقدمين', 'applicants')}</small></h2><table><thead><tr><th>${t('المعيار', 'Criterion')}</th>${cmpSel.map(x => `<th>${appName(x.app)}<div class="hint">${fmt1(x.ev.score)} · ${L(BAND[x.ev.band])}</div></th>`).join('')}</tr></thead><tbody>${prof.criteria.map((c, i) => `<tr><td>${critName(c.key)} <span class="hint num">${c.w}%</span></td>${cmpSel.map(x => { const rr = x.ev.rows[i]; return `<td>${chipLvl(rr.lvl)} ${rr.missing ? `<span class="src missing">${t('ناقص', 'missing')}</span>` : srcBadge(rr)}${rr.ev ? `<div class="hint" style="margin-top:4px">${esc(L(rr.ev)).slice(0, 70)}${L(rr.ev).length > 70 ? '…' : ''}</div>` : ''}</td>`; }).join('')}</tr>`).join('')}<tr><td><b>${t('الدرجة', 'Score')}</b></td>${cmpSel.map(x => `<td>${scoreHtml(x.ev)} <span class="hint">${t('تغطية', 'cov.')} ${pct(x.ev.coverage)}%</span></td>`).join('')}</tr></tbody></table></div>` : '';
  const stale = APPLICANTS.filter(a => a.opening === oid && (a.ai.stale || a.ai.dataChanged)).length;
  return pageTitle(t('ترتيب الشاغر: مشرف أمن — الرياض', 'Ranking: Security Supervisor — Riyadh'), `${N(r.all.length)} ${t('متقدمًا', 'applicants')} · ${N(r.N)} ${t('مرتَّبون', 'ranked')} · ${t('نسخة المعايير', 'profile version')} ${N(prof.version)}`,
    `<label class="tgl"><span class="sw ${S.rankOnlyEligible ? 'on' : ''}" data-action="toggleEligOnly"></span>${t('المرتَّبون فقط', 'Ranked only')}</label><button class="btn" data-action="cmpOpen" ${cmpSel.length < 2 ? 'disabled' : ''}>⇄ ${t('مقارنة', 'Compare')} <bdi>(${S.cmp.length})</bdi></button><button class="btn primary" data-action="exportCsv">⤓ ${t('تصدير القائمة', 'Export shortlist')} CSV</button>`) +
  (stale ? `<div class="note strong">⚠ ${N(stale)} ${t('تقييمات قديمة لا تدخل الترتيب (نسخة معايير سابقة أو بيانات معدّلة).', 'stale assessments are excluded from the ranking (previous criteria version or edited data).')} <button class="btn sm primary" data-action="rescoreAll">↻ ${t('إعادة تقييم الكل', 'Re-score all')}</button></div>` : '') +
  `<div class="split" style="grid-template-columns:1.8fr 1fr"><div>
    <div class="card"><h2>${t('المرتَّبون (مكتملون ومستوفون)', 'Ranked (completed and eligible)')} <small>${t('من الأعلى إلى الأدنى · حدد 2–3 للمقارنة', 'high to low · select 2–3 to compare')}</small></h2>${r.ranked.map(row).join('') || `<p class="hint">${t('لا أحد', 'Nobody')}</p>`}${disclaimer()}</div>
    ${cmpHtml}
    ${S.rankOnlyEligible ? '' : `<details class="collapse"><summary>${t('غير مستوفين', 'Not eligible')} (${N(r.notEligible.length)}) — ${t('لا يُرتَّبون، يبقون في بنك المتقدمين', 'not ranked, kept in the talent pool')}</summary><div style="margin-top:10px">${r.notEligible.map(x => other(x, L(x.ev.elig.reasons.find(q => q.ok === false) || {ar:'', en:''}))).join('')}</div></details>
    <details class="collapse"><summary>${t('يحتاج مراجعة', 'Needs review')} (${N(r.review.length)}) — ${t('قيمة مفقودة أو تغطية منخفضة أو تعارض', 'missing value, low coverage or contradiction')}</summary><div style="margin-top:10px">${r.review.map(x => other(x, x.ev.contradictions ? t('تعارض بين الإجابة والسيرة', 'Answer vs CV contradiction') : x.ev.elig.status === 'review' ? L(x.ev.elig.reasons.find(q => q.ok === null) || {ar:'', en:''}) : t('التغطية أقل من 60%', 'Coverage below 60%'))).join('')}</div></details>
    <details class="collapse"><summary>${t('غير مرتَّبين لأسباب أخرى', 'Not ranked for other reasons')} (${N(r.excluded.length)}) — ${t('جاري المعالجة، فشل، قديم، مكرر', 'processing, failed, stale, duplicate')}</summary><div style="margin-top:10px">${r.excluded.map(x => other(x, L(x.why))).join('')}</div></details>`}
  </div>
  <div><div class="card"><h2>${t('الأوزان المعتمدة', 'Approved weights')} <small>${N(prof.name)} ${N(prof.version)}</small></h2><table><tbody>${prof.criteria.map(c => `<tr><td>${critName(c.key)} ${c.mandatory ? `<span class="chip red">${t('إلزامي', 'mandatory')}</span>` : ''}</td><td class="num">${c.w}%</td></tr>`).join('')}<tr><td><b>${t('المجموع', 'Total')}</b></td><td class="num"><b>${weightSum(prof)}%</b></td></tr></tbody></table>
    <p class="hint">${t('تغيير الأوزان يكون من ملف المعايير (مسودة ← معاينة الأثر ← اعتماد نسخة جديدة ← إعادة تقييم الكل).', 'Weights change through the AI Job Profile (draft → impact preview → approve a new version → re-score all).')}</p></div>
    <div class="card"><h2>${t('كيف يُحسب', 'How it is computed')}</h2><div class="kv"><small>${t('الدرجة', 'score')}</small><span class="num">Σ(w% × level) ÷ 100</span><small>${t('المستويات', 'levels')}</small><span class="num">0 · 25 · 50 · 75 · 100</span><small>${t('التغطية', 'coverage')}</small><span class="num">Σw(evidence) ÷ Σw</span><small>${t('الفئات', 'bands')}</small><span>${t('مرتفعة: 75 فأكثر · متوسطة: 50 إلى 74 · منخفضة: أقل من 50', 'high: 75 or more · medium: 50 to 74 · low: below 50')}</span><small>${t('إلزامي', 'mandatory')}</small><span>${t('المستوى 0 ← منخفضة', 'level 0 → low')}</span><small>${t('مراجعة', 'review')}</small><span>${t('تغطية أقل من 60% أو تعارض', 'coverage below 60% or contradiction')}</span></div></div>
  </div></div>`;

function poolStory(x, prof){

  if (oev && oev.elig.status === 'not_eligible'){ label = {ar:'لماذا لم يناسب أصلًا', en:'Why not a fit originally'}; oev.elig.reasons.filter(r => r.ok === false).forEach(r => { was.push(L(r)); if (!prof.rules.some(q => q.fact === r.fact)) now.push(t(`الشاغر الجديد لا يشترط ${FACTS[r.fact].ar}`, `the new opening has no ${FACTS[r.fact].en.toLowerCase()} rule`)); }); }
  else if (oev && (oev.band === 'low' || oev.band === 'medium')){ label = {ar:'لماذا لم يناسب أصلًا', en:'Why not a fit originally'}; const mz = oev.rows.filter(r => r.mandatory && r.lvl === 0).map(r => critName(r.key)); was.push(t(`درجة ${L(BAND[oev.band])} (${fmt1(oev.score)}) في «${L(orig.designation)}»`, `${L(BAND[oev.band]).toLowerCase()} score (${fmt1(oev.score)}) for "${L(orig.designation)}"`) + (mz.length ? ` — ${t('إلزامي في المستوى 0:', 'mandatory at level 0:')} ${mz.join('، ')}` : '')); }
  else { label = {ar:'تقييمه السابق', en:'Previous assessment'}; was.push(oev ? t(`درجة ${fmt1(oev.score)} · ${L(BAND[oev.band])} في «${L(orig.designation)}»`, `score ${fmt1(oev.score)} · ${L(BAND[oev.band])} for "${L(orig.designation)}"`) : t('لم يكتمل تقييمه', 'assessment not completed')); }
  const nev = evalRules(x.a.facts, prof.rules);
  if (nev.status === 'eligible') now.push(t('يحقق شروط الشاغر الجديد', 'meets the new opening\'s rules')); else if (nev.status === 'review') now.push(t('قيمة مفقودة — تحتاج مراجعة', 'a value is missing — needs review'));

  return {label, was, now, nev, neutral: label.ar === 'تقييمه السابق'};

let batchTimer = null;
function startBatch(){
  if (batchTimer) clearInterval(batchTimer);
  S.batch = {total:1000, queued:1000, processing:0, completed:0, review:0, failed:0, t:0, done:false};
  batchTimer = setInterval(() => {
    const b = S.batch; b.t++;
    const take = Math.min(b.queued, 40); b.queued -= take; b.processing += take;
    const fin = Math.min(b.processing, 38); b.processing -= fin;
    const f = Math.round(fin * 0.012), r = Math.round(fin * 0.06); b.failed += f; b.review += r; b.completed += fin - f - r;
    if (b.queued === 0 && b.processing === 0) { b.done = true; clearInterval(batchTimer); batchTimer = null; }
    if (S.screen === 'batch') render();
  }, 160);
}

/* ---------- acceptance tests ---------- */
const TESTS = [
  {n:1, ar:'عند تقديم طلب من Web Form يظهر Job Applicant مرتبطًا بالوظيفة وبجميع الإجابات.', check:() => { const a = APPLICANTS.filter(x => x.opening === 'HR-OPN-2026-0011' && QUESTIONS.sec_sup.every(q => q.k in x.answers || q.optional)); return {ok: a.length === APPLICANTS.filter(x => x.opening === 'HR-OPN-2026-0011').length, how:{ar:`كل متقدم مرتبط بشاغر وتحمل سجلاته إجابات أسئلة الفرز (${a.length} سجلًا)`, en:`Every applicant is linked to an opening and carries the screening answers (${a.length} records)`}}; }},
  {n:2, ar:'عند تفعيل AI تظهر حالة Processing ثم Completed أو Needs Review أو Failed بوضوح.', check:() => { const st = new Set(APPLICANTS.map(a => a.ai.status)); return {ok: ['Processing','Completed','Needs Review','Failed'].every(s => st.has(s)), how:{ar:'حقل ai_status يظهر في القائمة وشاشة المتقدم والترتيب بالحالات الأربع', en:'ai_status appears in the list, the applicant screen and the ranking with all four states'}}; }},
  {n:3, ar:'كل درجة لها سبب ودليل من بيانات المتقدم، ولا تظهر مهارات لم يذكرها.', check:() => { let bad = 0; APPLICANTS.forEach(a => { const ev = resultOf(a); if (!ev) return; ev.rows.forEach(r => { if (!r.missing && r.lvl > 0 && !r.ev) bad++; if (r.cv && !(a.cv || []).join('\n').includes(r.cv.q)) bad++; if (r.form && r.form.src === 'form' && formLevel(a, r.key) === null) bad++; }); }); return {ok: bad === 0, how:{ar:'كل مستوى أعلى من 0 يحمل دليلًا: إجابة مخزّنة أو اقتباس حرفي من السيرة، والدليل الناقص مستوى 0 موسوم', en:'Every level above 0 carries evidence: a stored answer or a literal CV quote; missing evidence is level 0 and flagged'}}; }},
  {n:4, ar:'عند تعديل بيانات المتقدم لا تبقى النتيجة القديمة وكأنها حديثة.', check:() => { const r = ranking('HR-OPN-2026-0011'); const bad = r.ranked.filter(x => x.app.ai.stale || x.app.ai.dataChanged).length; return {ok: bad === 0, how:{ar:'تعديل إجابة أو اعتماد نسخة معايير يعلّم النتيجة «قديمة» ويخرجها من الترتيب حتى تُعاد', en:'Editing an answer or approving a criteria version flags the result stale and removes it from the ranking until re-scored'}}; }},
  {n:5, ar:'قائمة المرشحين لا تخلط بين الوظائف، وقرار التوظيف لا يتغير دون مستخدم مخوّل.', check:() => { const r = ranking('HR-OPN-2026-0011'); const mixed = r.all.some(x => x.app.opening !== 'HR-OPN-2026-0011'); const sys = S.audit.some(e => e.user.ar === 'النظام' && /ترشيح|رفض|تعليق/.test(e.action.ar)); return {ok: !mixed && !sys, how:{ar:'الترتيب لكل شاغر على حدة، وتغيير الحالة يتم بأزرار HR فقط ويُسجَّل باسم المستخدم', en:'Ranking is per opening; status changes happen only through HR buttons and are logged with the user name'}}; }},
  {n:6, ar:'عند تعطل خدمة AI يظل تقديم الطلب يعمل بشكل طبيعي.', check:() => { const a = APP('HR-APP-2026-2013'); return {ok: !!a && a.status === 'Open', how:{ar:'المهمة الفاشلة AI-JOB-0116 لم تمنع حفظ الطلب HR-APP-2026-2013 وظهوره في القائمة بحالة «جديد»', en:'Failed job AI-JOB-0116 did not stop application HR-APP-2026-2013 from being saved and listed as "Open"'}}; }},
  {n:7, ar:'المقابلات والاختبارات والعروض تستخدم بيانات المرشح نفسه.', na:true, check:() => ({ok:null, how:{ar:'خارج نطاق المرحلة الأولى — تستمر المقابلات والعروض في النظام كما هي', en:'Out of scope for phase one — interviews and offers continue in the system as they are'}})},

    for (const [k, v] of Object.entries(a.cvLv || {})) { if (!LEVELS.includes(v.lvl)) issues.push('bad cv level: ' + a.id + '/' + k); if (v.q && !text.includes(v.q)) issues.push('quote not in CV: ' + a.id + ' / ' + k); if (v.q && a.cv && !red.includes(v.q)) issues.push('quote not in REDACTED text: ' + a.id + ' / ' + k); }

    let wl = 0, wsum = 0; ev.rows.forEach((r, i) => { if (!LEVELS.includes(r.lvl)) issues.push('bad level: ' + a.id + '/' + r.key); wl += ws[i] * r.lvl; wsum += ws[i]; if (r.form && formLevel(a, r.key) === null) issues.push('form evidence without stored answer: ' + a.id + '/' + r.key); if (r.form) { const f = formLevel(a, r.key); if (f.ev.ar !== r.form.ev.ar) issues.push('form evidence != stored answer: ' + a.id + '/' + r.key); } if (r.missing && r.lvl !== 0 && !r.override) issues.push('missing evidence but level != 0: ' + a.id + '/' + r.key); });

  }

  r.ranked.forEach(x => { const a = x.app; if (x.ev.elig.status !== 'eligible' || x.ev.needsReview) issues.push('ranked but not eligible/review: ' + a.id); if (a.ai.status !== 'Completed') issues.push('ranked with ai_status ' + a.ai.status + ': ' + a.id); if (a.ai.stale || a.ai.dataChanged) issues.push('stale ranked: ' + a.id); if (a.dupOf) issues.push('duplicate ranked: ' + a.id); const k = rankOf(a.id); if (!k || k.rank !== x.rank || k.N !== r.N) issues.push('rank mismatch: ' + a.id); });
  for (let i = 1; i < r.ranked.length; i++) if (r.ranked[i].ev.score > r.ranked[i - 1].ev.score) issues.push('ranking not sorted');
  /* duplicates linked */
  APPLICANTS.filter(a => a.dupGroup).forEach(a => { if (!dupPeers(a).length) issues.push('duplicate without peer: ' + a.id); if (/\d{10}/.test(a.idNo)) issues.push('national ID displayed: ' + a.id); });
  /* pool exclusions */
  { const p = PROFILES.shift_lead; const excluded = APPLICANTS.filter(a => a.consentWithdrawn || a.retentionExpired || a.status === 'Accepted'); const keep = S.poolSearched; S.poolSearched = true; const html = rPool(); S.poolSearched = keep; excluded.forEach(a => { const idx = html.indexOf('data-action="poolInvite" data-id="' + a.id + '"'); if (idx >= 0) issues.push('excluded pool member can be invited: ' + a.id); }); void p; }
  /* acceptance tests 1–6 and 8 */
  runTests().forEach(x => { if (x.ok === false) issues.push('acceptance test failed: ' + x.t.n); });

  return {issues, counts:{applicants:APPLICANTS.length, ranked:r.N, review:r.review.length, notEligible:r.notEligible.length, excluded:r.excluded.length}, scores:r.all.map(x => [x.app.id, x.ev ? x.ev.score : null, x.ev ? x.ev.band : null, x.ev ? x.ev.elig.status : null, x.ev ? Math.round(x.ev.coverage * 100) : null, x.app.ai.status])};
};
