[project]
name = "talent-engine"
version = "0.1.0"
description = "AI screening and ranking engine for recruitment (standalone service)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8,<3",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0.30,<3",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "redis>=5",
    "rq>=1.16,<3",
    "httpx>=0.27",
    "python-multipart>=0.0.9",
    "orjson>=3.10",
    "rapidfuzz>=3.9",
    "python-dotenv>=1.2.4",
    "pymupdf>=1.28.2",
    "python-docx>=1.2.0",
    "pillow>=12.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "mypy>=1.14",
]
documents = [
    "en-core-web-sm",
    "paddleocr>=3.1",
    "paddlepaddle>=3.0",
    "presidio-analyzer>=2.2",
    "spacy>=3.8,<3.9",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::pytest.PytestUnraisableExceptionWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Body", "fastapi.File", "fastapi.Form"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
exclude = ["alembic/", "tests/"]
