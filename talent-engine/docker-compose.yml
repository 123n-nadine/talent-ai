# Talent Engine - Docker Compose project "talentai" (host ports 18000-18099 only)
name: talentai

x-engine: &engine
  build: .
  image: talentai/engine:dev
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-talentai}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make env)}@db:5432/${POSTGRES_DB:-talentai}
    REDIS_URL: redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make env)}@redis:6379/0
    FILE_STORE: /data/files
    OMP_NUM_THREADS: ${OCR_THREADS:-8}
    PADDLE_PDX_CACHE_HOME: /data/models/paddlex
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - files:/data/files
    - models:/data/models
  # Final QA: a Redis restart made the four workers exit (connection error) and nothing brought them
  # back. Restart after a failure exit only (Docker backs off up to a minute between tries); a clean
  # stop (`make down`, `compose stop`) stays stopped. vLLM, db and redis keep no policy.
  restart: on-failure

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-talentai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (make env)}
      POSTGRES_DB: ${POSTGRES_DB:-talentai}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-18030}:5432"   # loopback only: never reachable from outside the server
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-talentai} -d ${POSTGRES_DB:-talentai}"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 60s   # first init on a fresh volume can take ~1 minute on this disk

  redis:
    image: redis:7-alpine
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make env)}
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:?set REDIS_PASSWORD in .env (make env)}", "--save", "60", "1", "--appendonly", "no"]
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-18031}:6379"   # loopback only + password
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    <<: *engine
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"
    ports:
      # API reachable only on loopback and on the Tailscale address (never on 0.0.0.0 / LAN)
      - "127.0.0.1:${API_PORT:-18000}:8000"
      - "${API_BIND_TAILSCALE:?set API_BIND_TAILSCALE in .env (the server's Tailscale IPv4)}:${API_PORT:-18000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: *engine
    command: python -m app.worker
    depends_on:
      api:
        condition: service_healthy

  # Local LLM (phase 3). GPU is shared: the memory cap is agreed with the colleagues (SERVER_REPORT).
  # The port is reachable only inside the compose network (no host port).
  vllm:
    image: vllm/vllm-openai:${VLLM_IMAGE_TAG:-v0.31.0}
    command:
      - "--model"
      - "${VLLM_MODEL:-Qwen/Qwen3-8B-AWQ}"
      - "--served-model-name"
      - "${LLM_MODEL:-qwen3-8b-awq}"
      - "--quantization"
      - "awq"
      - "--dtype"
      - "float16"
      - "--max-model-len"
      - "${VLLM_MAX_MODEL_LEN:-8192}"
      - "--max-num-seqs"
      - "${VLLM_MAX_NUM_SEQS:-8}"
      - "--gpu-memory-utilization"
      - "${VLLM_GPU_MEMORY_UTILIZATION:-0.40}"
      - "--port"
      - "8000"
      - "--host"
      - "0.0.0.0"
    environment:
      HF_HOME: /data/models/hf          # model weights live in the talentai models volume, never in git
      HF_HUB_ENABLE_HF_TRANSFER: "0"
      VLLM_LOGGING_LEVEL: INFO
    volumes:
      - models:/data/models
    expose:
      - "8000"
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 80
      start_period: 300s

  embed:
    # talent pool embeddings: Qwen3-Embedding-0.6B on CPU, internal network only (no host port)
    build: ./embed
    image: talentai/embed:dev
    environment:
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      EMBED_THREADS: "4"
      HF_HOME: /data/models/hf
    volumes:
      - models:/data/models
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 40
      start_period: 180s

volumes:
  pgdata:
  redisdata:
  files:
  models:   # OCR model files (downloaded on first use), never in git
